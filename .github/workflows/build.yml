name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore Ledge.sln

      - name: Build
        run: dotnet build Ledge.sln --configuration Release --no-restore

      - name: Publish
        run: |
          dotnet publish src/Ledge.App/Ledge.App.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:EnableCompressionInSingleFile=true `
            -o artifacts

      - name: Rename executable
        run: |
          Move-Item artifacts/Ledge.App.exe artifacts/Ledge.exe -Force

      - name: Generate SHA256
        run: |
          $hash = Get-FileHash artifacts/Ledge.exe -Algorithm SHA256
          Set-Content -Path artifacts/Ledge.exe.sha256 -Value $hash.Hash

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Ledge
          path: artifacts/*
          retention-days: 30

  release:
    needs: build
    runs-on: windows-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: Ledge
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/Ledge.exe
            artifacts/Ledge.exe.sha256
          generate_release_notes: true
          draft: false
          prerelease: false