name: Build and Release

on:
  push:
    branches:
      - master
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore Ledge.sln

      - name: Build
        run: dotnet build Ledge.sln --configuration Release --no-restore

      - name: Publish
        run: |
          dotnet publish src/Ledge.App/Ledge.App.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:EnableCompressionInSingleFile=true `
            -o artifacts/app

      - name: Rename executable
        run: |
          Move-Item artifacts/app/Ledge.App.exe artifacts/app/Ledge.exe -Force

      - name: Build installer
        run: |
          if (!(Test-Path 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe')) {
            choco install innosetup -y --no-progress
          }
          .\build\installer.ps1 -SkipPublish
          Copy-Item artifacts/app/Ledge.exe artifacts/installer/Ledge.exe
          (Get-FileHash artifacts/installer/Ledge.exe -Algorithm SHA256).Hash | Set-Content artifacts/installer/Ledge.exe.sha256

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Ledge
          path: |
            artifacts/installer/Ledge-Setup.exe
            artifacts/installer/Ledge-Setup.exe.sha256
            artifacts/installer/Ledge.exe
            artifacts/installer/Ledge.exe.sha256
          retention-days: 30

  release:
    needs: build
    runs-on: windows-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: Ledge
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/Ledge-Setup.exe
            artifacts/Ledge-Setup.exe.sha256
            artifacts/Ledge.exe
            artifacts/Ledge.exe.sha256
          generate_release_notes: true
          draft: false
          prerelease: false
