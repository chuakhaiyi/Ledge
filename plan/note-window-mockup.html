<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Ledge — note window mockup</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500&display=swap" rel="stylesheet">
<link href="https://api.fontshare.com/v2/css?f[]=general-sans@400,500,600&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:'General Sans', sans-serif;
    background:linear-gradient(160deg,#2B2E35 0%, #1B1D22 65%);
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:40px;
  }
  .caption{
    position:fixed;
    top:28px;
    left:40px;
    color:#8A8D91;
    font-size:13px;
  }
  .caption b{color:#EAE6DC;font-family:'Fraunces',serif;font-weight:500;font-size:16px;display:block;margin-bottom:4px;}

  .note{
    width:300px;
    background:#C7D2B8;
    border-radius:8px;
    box-shadow:0 30px 60px rgba(0,0,0,0.4);
    overflow:hidden;
  }
  .titlebar{
    height:30px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 10px;
    background:rgba(27,29,34,0.06);
  }
  .titlebar .dots{display:flex;gap:6px;}
  .titlebar .dots span{
    width:8px;height:8px;border-radius:50%;
    background:rgba(27,29,34,0.28);
  }
  .titlebar .colorpick{
    display:flex;gap:5px;
  }
  .titlebar .colorpick span{
    width:10px;height:10px;border-radius:50%;
    display:inline-block;
  }
  .body{
    padding:18px 18px 14px;
    font-size:15px;
    line-height:1.5;
    color:#1B1D22;
    min-height:130px;
  }
  .footer{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:0 18px 14px;
    font-size:11px;
    color:rgba(27,29,34,0.5);
  }
  .footer .pin{
    display:flex;align-items:center;gap:5px;
  }
  .footer .pin .dot{
    width:6px;height:6px;border-radius:50%;background:#B5642C;
  }
</style>
</head>
<body>
  <div class="caption"><b>One window per note</b>Borderless, no taskbar entry — dragged anywhere, closed like any window</div>
  <div class="note">
    <div class="titlebar">
      <div class="dots"><span></span><span></span></div>
      <div class="colorpick">
        <span style="background:#F0DFAE"></span>
        <span style="background:#E7C3AE"></span>
        <span style="background:#1B1D22;box-shadow:0 0 0 2px rgba(27,29,34,0.3);"></span>
        <span style="background:#BFD2D6"></span>
      </div>
    </div>
    <div class="body">Call the vet before 5 — ask about the refill too, they said it might need a new script.</div>
    <div class="footer">
      <span>edited just now</span>
      <span class="pin"><span class="dot"></span>pinned</span>
    </div>
  </div>
</body>
</html>
